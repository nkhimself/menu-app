# Builds a TEST Android app (debug APK) from the website files in this repository.
# Run it: Actions tab -> "Build Android APK" -> Run workflow. Download the APK from the finished run (Artifacts).
name: Build Android APK
on: workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Collect the website files
        run: |
          mkdir -p build/www
          cp index.html app.js logic.js sync.js config.js templates.js card.js sw.js style.css vazirmatn.woff2 manifest.json icon-192.png icon-512.png icon-maskable-512.png build/www/

      - name: Create the Android project
        working-directory: build
        run: |
          npm init -y
          npm install @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7 @capacitor/local-notifications@7
          npx cap init "ترازینا" ir.tarazina.app --web-dir www
          npx cap add android
          # do not let Android cloud-backup copy login tokens off the phone
          sed -i 's/android:allowBackup="true"/android:allowBackup="false"/' android/app/src/main/AndroidManifest.xml
          grep -n "allowBackup" android/app/src/main/AndroidManifest.xml
          grep -q POST_NOTIFICATIONS android/app/src/main/AndroidManifest.xml || sed -i 's|<application|<uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n    <application|' android/app/src/main/AndroidManifest.xml
          npx cap sync android

      - name: Use the Tarazina icon and launch screen
        working-directory: build
        run: |
          pip install pillow
          python3 - <<'PY'
          import glob, os
          from PIL import Image
          res = 'android/app/src/main/res'
          src = Image.open('www/icon-512.png').convert('RGBA')
          sizes = {'mdpi': 48, 'hdpi': 72, 'xhdpi': 96, 'xxhdpi': 144, 'xxxhdpi': 192}
          n = 0
          for d, s in sizes.items():
              folder = os.path.join(res, 'mipmap-' + d)
              os.makedirs(folder, exist_ok=True)
              for name in ('ic_launcher', 'ic_launcher_round', 'ic_launcher_foreground'):
                  src.resize((s, s), Image.LANCZOS).save(os.path.join(folder, name + '.png'))
                  n += 1
          print('launcher icons written:', n)
          # adaptive-icon xml would still show the old foreground, so remove it
          import shutil
          shutil.rmtree(os.path.join(res, 'mipmap-anydpi-v26'), ignore_errors=True)
          # plain teal launch screen instead of the default Capacitor logo
          m = 0
          for f in glob.glob(res + '/**/splash*.png', recursive=True):
              w, h = Image.open(f).size
              Image.new('RGB', (w, h), (14, 107, 111)).save(f)
              m += 1
          print('launch screens replaced:', m)
          assert n == 15
          PY

      - name: Build the debug APK
        working-directory: build/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: tarazina-debug-apk
          path: build/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
