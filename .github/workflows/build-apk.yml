# Builds a TEST Android app (debug APK) from the website files in this repository.
# Run it: Actions tab -> "Build Android APK" -> Run workflow. Download the APK from the finished run (Artifacts).
name: Build Android APK
on: workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Collect the website files
        run: |
          mkdir -p build/www
          cp index.html app.js logic.js sync.js config.js templates.js sw.js style.css vazirmatn.woff2 manifest.json icon-192.png icon-512.png build/www/

      - name: Create the Android project
        working-directory: build
        run: |
          npm init -y
          npm install @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7
          npx cap init "قیمت‌گذار منو" ir.menuprice.app --web-dir www
          npx cap add android
          # do not let Android cloud-backup copy login tokens off the phone
          sed -i 's/android:allowBackup="true"/android:allowBackup="false"/' android/app/src/main/AndroidManifest.xml
          grep -n "allowBackup" android/app/src/main/AndroidManifest.xml
          npx cap sync android

      - name: Build the debug APK
        working-directory: build/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: menu-pricer-debug-apk
          path: build/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
