  <span id="syncstat" class="sync" role="status"></span>
</header>

<div id="scrim"></div>
<aside id="drawer" aria-label="منوی برنامه">

  <nav id="tabs">
    <div class="grp">شروع</div>
    <button data-tab="setup"><svg class="ico"><use href="#i-start"/></svg>نوع کسب‌وکار و راه‌اندازی</button>

    <button data-tab="chg"><svg class="ico"><use href="#i-chg"/></svg>ثبت قیمت جدید مواد</button>
    <button data-tab="res"><svg class="ico"><use href="#i-res"/></svg>پیشنهاد قیمت همهٔ محصولات</button>

</aside>

<main id="view"></main>

<nav id="nav" aria-label="بخش‌های اصلی">

  <button data-nav="ings"><svg class="ico"><use href="#i-ing"/></svg><span>مواد اولیه</span></button>
  <button id="plus" class="plus" aria-label="افزودن" aria-haspopup="dialog"><svg class="ico"><use href="#i-plus"/></svg></button>
  <button data-nav="packs"><svg class="ico"><use href="#i-box"/></svg><span>بسته‌بندی</span></button>
  <button data-nav="quick"><svg class="ico"><use href="#i-calc"/></svg><span>قیمت سریع</span></button>
</nav>

<div id="sheetwrap" hidden></div>
